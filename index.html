<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Despesas - 2026</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header id="cabecalho">
            <h1 id="titulo-cabecalho">Controle de Despesas</h1>
            <p id="p-cabecalho">Acompanhe seus gastos mensais.</p>
        </header>

        <section class="card">
            <h2>Informações Pessoais</h2>
            <hr>
            <form id="form-perfil">
                <div class="perfil-grid">
                    <div class="campo">
                        <label for="nome">Nome: </label>
                        <input type="text" id="nome" required>
                    </div>

                    <div class="campo">
                        <label for="salario">Salario Mensal: </label>
                        <input type="number" id="salario"  min="0" required>
                    </div>
                    <div class="campo">
                        <label for="alimentacao">Alimentação: </label>
                        <input type="number" id="alimentacao" min="0" required>
                    </div>

                </div>

                <button type="submit" id="btn-salvar-pessoal">
                    Salvar Informações
                </button>
            </form>
        </section>

        <section class="card">
            <h2>Adicionar Despesas</h2>
            <hr>
            <div class="form-perfil">
                <form id="form-despesas" class="form-grid">
                    <div class="campo">
                        <label for="descricao">Descrição</label>
                        <input type="text" id="descricao" required>
                    </div>

                    <div class="campo">
                        <label for="categoria">Categoria</label>
                        <select id="categoria" required>
                            <option value="cartao">Cartão de Crédito</option>
                            <option value="aluguel">Aluguel</option>
                            <option value="agua">Água</option>
                            <option value="luz">Luz</option>
                            <option value="internet">internet</option>
                            <option value="outros">Outros</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="valor">Valor</label>
                        <input type="number" id="valor" min="0" required>
                    </div>

                    <button type="submit" id="btn-salvar-despesa">Adicionar Despesa</button>
                </form>
            </div>
        </section>

        <section class="card">
            <div class="form-despesas">
                <table>
                    <thead>
                        <tr>
                            <th>Descrição</th>
                            <th>Categoria</th>
                            <th>Valor</th>
                            <th>Ação</th>
                        </tr>
                    </thead>

                    <tbody id="listaDespesas">
                        <tr>
                            <td colspan="4">Nenhuma despesa cadastrada.</td>
                        </tr>
                    </tbody>

                </table>
            </div>
        </section>

        <section class="card">
            <h2>Resumo Financeiro</h2>
            <hr>

            <div id="calculo" class="resumo-grid">

                <div class="campo">
                    <p>Salário:</p>
                    <h2 id="salarioResumo">R$ 0,00</h2>
                </div>

                <div class="campo">
                    <p>Alimentação:</p>
                    <h2 id="alimentacaoResumo">R$ 0,00</h2>
                </div>

                <div class="campo">
                    <p>Total:</p>
                    <h2 id="totalResumo">R$ 0,00</h2>
                </div>

                <div class="campo">
                    <p>Saldo disponível:</p>
                    <h2 id="saldoPagar">R$ 0,00</h2>
                </div>

            </div>
        </section>
    </div>
    </div>

    <script src="script.js"></script>

</body>

</html>
