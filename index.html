<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Despesas - 2026</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header id="cabecalho">
            <h1 id="titulo-cabecalho">Controle de Despesas</h1>
            <p id="p-cabecalho">Acompanhe seus gastos mensais.</p>
        </header>

        <section class="card">
            <h2>Informações Pessoais</h2>
            <hr>

            <form id="form-perfil">
                <div class="perfil-grid">
                    <div class="campo">
                        <label for="nome">Nome: </label>
                        <input type="text" id="nome" required>
                    </div>

                    <div class="campo">
                        <label for="salario">Salario Mensal: </label>
                        <input type="number" id="salario" required>
                    </div>
                    <div class="campo">
                        <label for="alimentacao">Alimentação: </label>
                        <input type="text" id="alimentacao" required>
                    </div>

                </div>

                <button type="submit" id="btn-salvar-pessoal">
                    Salvar Informações
                </button>
            </form>
        </section>

        <section class="card">
            <div class="form-grid">
                <form id="form-despesas">
                    <div class="form-info">
                        <label for="descricao">Descrição</label>
                        <input type="text" id="descricao" required>
                    </div>
                    <div class="form-info">
                        <label for="categoria">Categoria</label>
                        <select id="categoria" required>
                            <option value="cartao">Cartão de Crédito</option>
                            <option value="aluguel">Aluguel</option>
                            <option value="agua">Água</option>
                            <option value="luz">Luz</option>
                            <option value="internet">internet</option>
                            <option value="outros">Outros</option>
                        </select>
                    </div>
                    <div class="form-info">
                        <div id="valor-despesa">
                            <label for="valor">Valor</label>
                            <input type="number" id="valor" required>
                        </div>
                    </div>

                    <button type="submit" id="btn-salvar-despesa">Adicionar Despesa</button>
                </form>
        </section>


        <div class="tabela-despesas">
            <table>
                <thead>
                    <tr>
                        <th>Descrição</th>
                        <th>Categoria</th>
                        <th>Valor</th>
                        <th>Ação</th>
                    </tr>
                </thead>

                <tbody id="listaDespesas">
                    <tr>
                        <td colspan="4">Nenhuma despesa cadastrada.</td>
                    </tr>
                </tbody>

            </table>

        </div>
    </div>

    <script src="script.js"></script>

</body>

</html>
